spring:
  application:
    name: scentstation-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/scentstation}
    username: ${DB_USER:scent}
    password: ${DB_PASSWORD:scent}

  jpa:
    hibernate:
      # Flyway owns the schema. 'validate' makes the application refuse to start
      # when an entity no longer matches its table, which catches drift early.
      # 'update' is never used: it cannot create the partial unique indexes that
      # carry BR2, BR6, NFR3.3 and NFR3.4 (Report section 2.7.4).
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

logging:
  level:
    vn.edu.uth.scentstation: DEBUG

scentstation:
  security:
    # Development secret only. In any shared deployment this comes from the
    # JWT_SECRET environment variable and never from this file.
    jwt-secret: ${JWT_SECRET:change-me-this-development-secret-is-at-least-32-bytes-long}
    jwt-ttl-minutes: ${JWT_TTL_MINUTES:480}

  order:
    # How long an unpaid order stays PENDING before it expires (FR3.9).
    ttl-seconds: 180

  payment:
    # Shared secret the simulated payment provider signs its webhook with (FR3.7).
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:dev-payment-webhook-secret}

  dispensing:
    # Command validity window in seconds (Report section 2.9.3 step 6, BR7).
    command-ttl-seconds: 30
    # How long to wait for a device result before an order becomes UNCERTAIN
    # (BR14, NFR4.5). Must be comfortably longer than command-ttl-seconds.
    result-timeout-seconds: 60

  mqtt:
    broker-url: ${MQTT_URL:tcp://localhost:1883}
    client-id: scentstation-backend
    # Shared secret used for the HMAC-SHA256 command signature (NFR2.6).
    # The simulator must be started with the same value.
    command-secret: ${MQTT_COMMAND_SECRET:dev-command-signing-secret}
    # A machine is marked OFFLINE when no heartbeat arrives within this window (FR5.2).
    heartbeat-timeout-seconds: 45
